name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install quality tools
        run: python -m pip install ruff==0.12.7
      - name: Compile Python files
        run: python -m compileall -q custom_components tests scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository metadata
        run: python scripts/validate_repository.py
      - name: Run Ruff
        if: matrix.python-version == '3.14'
        run: ruff check custom_components tests scripts
      - name: Check Ruff formatting
        if: matrix.python-version == '3.14'
        run: ruff format --check custom_components tests scripts
